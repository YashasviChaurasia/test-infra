apiVersion: v1
kind: Service
metadata:
  name: {{ include "dashboard.fullname" . }}-svc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.pod.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "dashboard.labels" . | nindent 4 }}
